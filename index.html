function fbSet(path,data){
 if(!_fbReady||!_fbDB)return;
 try{_fbDB.ref(path).set(data);}catch(e){}
}
function fbUpdate(path,data){

function fbGet(path,cb){

 try{_fbDB.ref(path).once("value",function(snap){cb(snap.val());},function(){cb(null);});}
 catch(e){cb(null);}

// [A] Default users - passwords stored as SHA-256 hashes
// Admin@2026 → hashed | Gv@2026 → hashed (set on first run)
var S={users:[],user:null,page:"home",collapsed:false,stats:null,nav:{}};

// [A] Hash function using SubtleCrypto (SHA-256) with salt
function hashPw(pw){
 var salted="mbe2026_"+pw;
 if(window.crypto&&window.crypto.subtle){
  return window.crypto.subtle.digest("SHA-256",new TextEncoder().encode(salted))
   .then(function(b){return Array.from(new Uint8Array(b)).map(function(n){return n.toString(16).padStart(2,"0");}).join("");});
 }
 return Promise.resolve(btoa(unescape(encodeURIComponent(salted))));
}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function emptyStats(){return{xp:0,totalXp:0,streak:1,lastDay:today(),vocabKnown:{},ansCorrect:0,ansTotal:0,quizDone:{},testBest:null,testHistory:[],daily:{},combo:0,maxCombo:0,hearts:5,maxHearts:5,lastHeartRegen:"",level:1,levelXp:0};}
function sk(u){return"mbe_st_v13_"+u.id;}
function loadAll(){
 initFirebase();
 // Load from localStorage first (instant)
 var raw=store.get("mbe_usr_v13");
 if(raw){try{S.users=JSON.parse(raw);}catch(e){S.users=[];}}
 // Then sync from Firebase (authoritative)
 fbGet("users",function(data){
  if(data){
   var arr=Object.values(data);
   if(arr.length){
    S.users=arr;
    store.set("mbe_usr_v13",JSON.stringify(arr));
    // If session is active, refresh S.user from updated list
    if(S.user){
     var fresh=arr.filter(function(u){return u.id===S.user.id;})[0];
     if(fresh)S.user=fresh;
    }
   }
  }
  // If still no users, create defaults
  if(!S.users.length){
   var defaults=[
    {id:1,name:"Admin MBE",email:"admin@mbe.vn",pw:"Admin@2026",lop:0,role:"admin",level:"",avatar:"AD"},
    {id:2,name:"Giáo viên MBE",email:"gv@mbe.vn",pw:"Gv@2026",lop:0,role:"teacher",level:"",avatar:"GV"}
   ];
   var pending=defaults.length;
   defaults.forEach(function(d){
    hashPw(d.pw).then(function(h){
     var nu={id:d.id,name:d.name,email:d.email,pwh:h,lop:d.lop,role:d.role,level:d.level,avatar:d.avatar};

     if(--pending===0)saveUsers();
    });
   });
  }
 });
}

// ── Session restore ──────────────────────────────────────────────
function restoreSession(){
 var sid=store.get("mbe_session");
 if(!sid)return false;
 // Wait for users to be loaded (may be async on first run)
 var u=S.users.filter(function(u){return String(u.id)===sid;})[0];
 if(!u)return false;
 S.user=u;
 if(u.role==="admin"||u.role==="teacher"){S.stats=emptyStats();}
 else{loadStats(u);}
 S.page="home";
 return true;
}
function loadStats(u){
 // Load from localStorage immediately (fast)
 try{var s=store.get(sk(u));if(s){S.stats=JSON.parse(s);if(!S.stats.testHistory)S.stats.testHistory=[];}else S.stats=emptyStats();}
 catch(e){S.stats=emptyStats();}
 var t=today();
 if(S.stats.lastDay!==t){
  var last=new Date(S.stats.lastDay),now=new Date(t),diff=(now-last)/864e5;
  S.stats.streak=diff<=1.5?(S.stats.streak||0)+1:1;
  S.stats.lastDay=t;saveStats();
 }
 // Sync from Firebase in background
 fbGet("stats/"+u.id,function(fbData){
  if(fbData&&typeof fbData==="object"){
   var localXP=S.stats.xp||0;
   var fbXP=fbData.xp||0;
   if(fbXP>localXP){
    S.stats=fbData;
    if(!S.stats.testHistory)S.stats.testHistory=[];
    store.set(sk(u),JSON.stringify(S.stats));
   }
  }
 });
 // [H] Show onboarding for new users
 if(!S.stats.onboarded){
  setTimeout(function(){showOnboarding();},800);
 }
}
function saveStats(){
 store.set(sk(S.user),JSON.stringify(S.stats));
 // Sync stats to Firebase (non-blocking)
 if(_fbReady&&S.user){
  fbSet("stats/"+S.user.id,S.stats);
 }
}
function addXP(amount,label,color){if(!amount||amount<=0)return;var t=today();if(!S.stats.daily[t])S.stats.daily[t]={xp:0,correct:0,total:0};var prev=S.stats.daily[t].xp||0;S.stats.xp+=amount;S.stats.totalXp=(S.stats.totalXp||0)+amount;S.stats.daily[t].xp+=amount;updateLevel();saveStats();showXpPopup(amount,label,color);if(prev<DAILY_GOAL&&S.stats.daily[t].xp>=DAILY_GOAL){setTimeout(function(){showXpPopup(10,"🎯 Mục tiêu hôm nay!","#16a34a");S.stats.xp+=10;S.stats.totalXp+=10;S.stats.daily[t].xp+=10;saveStats();},1100);}setTimeout(function(){var nb=checkNewBadges(S.stats);if(nb.length)badgePopup(nb);},400);}
function recAns(ok){S.stats.ansTotal++;var t=today();if(!S.stats.daily[t])S.stats.daily[t]={xp:0,correct:0,total:0};S.stats.daily[t].total++;if(ok){S.stats.ansCorrect++;S.stats.daily[t].correct++;S.stats.combo=(S.stats.combo||0)+1;if(S.stats.combo>(S.stats.maxCombo||0))S.stats.maxCombo=S.stats.combo;var mult=Math.min(S.stats.combo,4);var earned=5*mult;var lbl=S.stats.combo>=4?"🔥 MAX x4!":S.stats.combo>=3?"🔥 x3!":S.stats.combo>=2?"🔥 x2!":"OK!";var clr=S.stats.combo>=4?"#7c3aed":S.stats.combo>=3?"#ea580c":S.stats.combo>=2?"#d97706":"#16a34a";addXP(earned,lbl,clr);if(S.stats.combo>=2)setTimeout(function(){showComboPopup(S.stats.combo);},150);}else{S.stats.combo=0;S.stats.hearts=Math.max((S.stats.hearts||5)-1,0);showHeartLost();saveStats();}}

function getEarnedBadges(st){
 return BADGES.filter(function(b){try{return b.check(st);}catch(e){return false;}});
}
function checkNewBadges(st){
 // Returns newly earned badges since last check
 var earned=getEarnedBadges(st);
 var known=st.knownBadges||[];
 var newOnes=earned.filter(function(b){return known.indexOf(b.id)<0;});
 if(newOnes.length){
  st.knownBadges=earned.map(function(b){return b.id;});
  saveStats();
 }
 return newOnes;
}

function speak(t){
 if(!t||_speakLock)return;
 _speakLock=true;
 setTimeout(function(){_speakLock=false;},600);
 try{
  if(speechSynthesis.speaking)speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);
  u.lang="en-US";u.rate=0.85;u.pitch=1;u.volume=1;
  setTimeout(function(){
   try{speechSynthesis.speak(u);}catch(e){}
  },80);
 }catch(e){}
}
window._sp=speak;
// ── ONE-TIME audio delegation on document ──
document.addEventListener("click",function(e){
 var btn=e.target.closest("[data-speak]");
 if(!btn)return;
 if(btn.getAttribute("data-stop")==="1")e.stopPropagation();
 var word=btn.getAttribute("data-speak");
 if(word)speak(word);
},true);

function doFill(){
 var n=S.nav;if(n.ans!==null&&n.ans!==undefined)return;
 var inp=el("qfi");if(!inp)return;var v=(inp.value||"").trim();if(!v)return;

 var norm=function(s){return String(s).toLowerCase().trim().replace(/\s+/g," ");};
 n.ans=norm(v)===norm(q.a);if(n.ans)n.sc++;recAns(n.ans);rerender();
}


// ── [J] PWA — Service Worker + Install Banner ───────────────────────────
var _pwaPrompt=null;

// Register Service Worker via Blob (works for file:// and https://)
(function(){
 if(!('serviceWorker' in navigator)||location.protocol!=='https:'){console.warn('[MBE] SW: needs HTTPS');return;}
 try{
  var swCode='var CACHE=\'mbe-v140\';\nvar ASSETS=[\'/\'];\nself.addEventListener(\'install\',function(e){\n e.waitUntil(\n  caches.open(CACHE).then(function(c){\n   return c.addAll(ASSETS).catch(function(){return;});\n  })\n );\n self.skipWaiting();\n});\nself.addEventListener(\'activate\',function(e){\n e.waitUntil(\n  caches.keys().then(function(keys){\n   return Promise.all(keys.filter(function(k){return k!==CACHE;}).map(function(k){return caches.delete(k);}));\n  })\n );\n self.clients.claim();\n});\nself.addEventListener(\'fetch\',function(e){\n if(e.request.method!==\'GET\')return;\n e.respondWith(\n  caches.match(e.request).then(function(cached){\n   var fresh=fetch(e.request).then(function(r){\n    if(r&&r.status===200){\n     var clone=r.clone();\n     caches.open(CACHE).then(function(c){c.put(e.request,clone);});\n    }\n    return r;\n   }).catch(function(){return cached;});\n   return cached||fresh;\n  })\n );\n});';
  var blob=new Blob([swCode],{type:'application/javascript'});
  var swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl,{scope:'./'}).then(function(reg){
   console.log('[MBE] SW registered');
  }).catch(function(e){
   console.warn('[MBE] SW failed:',e.message);
  });
 }catch(e){console.warn('[MBE] SW error:',e);}
})();
